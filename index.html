*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:var(--md-sys-color-surface);
  color:var(--md-sys-color-on-surface);
  font-family:Roboto,system-ui,sans-serif;
  overflow-x:clip;
}

[hidden]{
  display:none!important;
}

.app-bar{
  position:sticky;
  top:0;
  z-index:5;
  background:var(--md-sys-color-surface);
}

.app-bar .row{
  display:flex;
  align-items:center;
  gap:4px;
  padding:8px 16px;
  max-width:720px;
  margin:0 auto;
  min-height:56px;
}

.small-title{
  font:var(--md-sys-typescale-title-large);
  margin:0;
  opacity:0;
  transition:opacity .2s cubic-bezier(.2,0,0,1);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.app-bar.collapsed .small-title{
  opacity:1;
}

.spacer{
  flex:1;
}

.big-wrap{
  max-width:720px;
  margin:0 auto;
  padding:0 16px;
}

.big-title{
  font:var(--md-sys-typescale-headline-medium);
  margin:0;
  padding:24px 0 16px;
}

.icon-btn{
  width:48px;
  height:48px;
  border-radius:var(--md-sys-shape-corner-full);
  border:none;
  background:transparent;
  color:var(--md-sys-color-on-surface);
  display:grid;
  place-items:center;
  cursor:pointer;
  flex:none;
  position:relative;
  overflow:hidden;
}

.icon-btn::before{
  content:"";
  position:absolute;
  inset:0;
  background:currentColor;
  opacity:0;
  transition:opacity .2s;
  border-radius:inherit;
}

.icon-btn:hover::before{
  opacity:var(--md-sys-state-hover-opacity);
}

.icon-btn:focus-visible::before{
  opacity:var(--md-sys-state-focus-opacity);
}

.icon-btn:active::before{
  opacity:var(--md-sys-state-pressed-opacity);
}

.icon-btn svg{
  width:24px;
  height:24px;
  fill:currentColor;
  position:relative;
}

.bar-input{
  flex:1;
  min-width:0;
  background:none;
  border:none;
  outline:none;
  color:var(--md-sys-color-on-surface);
  font:var(--md-sys-typescale-title-medium);
  height:48px;
}

.bar-input::placeholder{
  color:var(--md-sys-color-on-surface-variant);
}

.list{
  max-width:720px;
  margin:0 auto;
  padding:0 16px 32px;
}

.sec{
  color:var(--md-sys-color-primary);
  font:var(--md-sys-typescale-label-large);
  padding:24px 0 8px;
}

.muted{
  color:var(--md-sys-color-on-surface-variant);
  padding:24px;
  font:var(--md-sys-typescale-body-large);
}

.group{
  display:flex;
  flex-direction:column;
  gap:2px;
}

.card{
  background:var(--md-sys-color-surface-container-low);
  border-radius:var(--md-sys-shape-corner-extra-small);
  padding:16px;
  display:flex;
  gap:16px;
  align-items:center;
  position:relative;
  overflow:hidden;
}

a.card{
  color:inherit;
  text-decoration:none;
}

a.card:focus-visible{
  outline:2px solid var(--md-sys-color-primary);
  outline-offset:-2px;
}

.group .card:first-child{
  border-radius:var(--md-sys-shape-corner-extra-large) var(--md-sys-shape-corner-extra-large) var(--md-sys-shape-corner-extra-small) var(--md-sys-shape-corner-extra-small);
}

.group .card:last-child{
  border-radius:var(--md-sys-shape-corner-extra-small) var(--md-sys-shape-corner-extra-small) var(--md-sys-shape-corner-extra-large) var(--md-sys-shape-corner-extra-large);
}

.group .card:only-child{
  border-radius:var(--md-sys-shape-corner-extra-large);
}

.card.click{
  cursor:pointer;
}

.card.click::before{
  content:"";
  position:absolute;
  inset:0;
  background:var(--md-sys-color-on-surface);
  opacity:0;
  transition:opacity .2s;
}

.card.click:hover::before{
  opacity:var(--md-sys-state-hover-opacity);
}

.card.click:active::before{
  opacity:var(--md-sys-state-pressed-opacity);
}

.card .txt{
  flex:1;
  min-width:0;
  position:relative;
}

.card .t{
  font:var(--md-sys-typescale-body-large);
  margin:0 0 2px;
}

.card .s{
  font:var(--md-sys-typescale-body-medium);
  color:var(--md-sys-color-on-surface-variant);
  margin:0;
}

.card .s.code{
  font:var(--md-sys-typescale-label-medium);
  letter-spacing:.5px;
}

.cb{
  width:22px;
  height:22px;
  border:2px solid var(--md-sys-color-on-surface-variant);
  border-radius:var(--md-sys-shape-corner-extra-small);
  position:relative;
  flex:none;
  margin:0 13px;
  transition:background-color .2s,border-color .2s;
}

.cb .g{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:none;
  pointer-events:none;
}

.card.checked .cb,
.card.ind .cb{
  background:var(--md-sys-color-primary);
  border-color:var(--md-sys-color-primary);
  color:var(--md-sys-color-on-primary);
}

.card.checked .cb .g-check{
  display:block;
}

.card.ind .cb .g-ind{
  display:block;
}

.accents{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.accent{
  width:48px;
  height:48px;
  border:none;
  border-radius:var(--md-sys-shape-corner-full);
  cursor:pointer;
  display:grid;
  place-items:center;
  padding:0;
}

.accent svg{
  width:24px;
  height:24px;
  fill:currentColor;
  opacity:0;
}

.accent.on svg{
  opacity:1;
}

.accent[data-accent="orange"]{background:#7f4f24;color:#fff8f4}
.accent[data-accent="blue"]{background:#0061a4;color:#ffffff}
.accent[data-accent="green"]{background:#386a20;color:#ffffff}
.accent[data-accent="purple"]{background:#6750a4;color:#ffffff}
.accent[data-accent="red"]{background:#ba1a1a;color:#ffffff}

@media (prefers-color-scheme: dark){
  .accent[data-accent="orange"]{background:#f1a659;color:#452a10}
  .accent[data-accent="blue"]{background:#9ecaff;color:#003258}
  .accent[data-accent="green"]{background:#9dd67f;color:#1c3700}
  .accent[data-accent="purple"]{background:#d0bcff;color:#381e72}
  .accent[data-accent="red"]{background:#ffb4ab;color:#690005}
}

.seg{
  display:flex;
  border:1px solid color-mix(in srgb,var(--md-sys-color-on-surface) 55%,transparent);
  border-radius:var(--md-sys-shape-corner-full);
  overflow:hidden;
}

.seg button{
  flex:1;
  border:none;
  background:transparent;
  color:var(--md-sys-color-on-surface);
  font:var(--md-sys-typescale-label-large);
  padding:10px 4px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  position:relative;
  overflow:hidden;
}

.seg button+button{
  border-left:1px solid color-mix(in srgb,var(--md-sys-color-on-surface) 55%,transparent);
}

.seg button::before{
  content:"";
  position:absolute;
  inset:0;
  background:currentColor;
  opacity:0;
  transition:opacity .2s;
}

.seg button:active::before{
  opacity:var(--md-sys-state-pressed-opacity);
}

.seg button.on{
  background:var(--md-sys-color-secondary-container);
  color:var(--md-sys-color-on-secondary-container);
}

.seg button .tick{
  width:0;
  height:16px;
  fill:currentColor;
  overflow:hidden;
  transition:width .25s;
  position:relative;
}

.seg button.on .tick{
  width:16px;
}

#sliderBox{
  overflow:hidden;
}

.m3-slider-container{
  position:relative;
  width:100%;
  height:56px;
  user-select:none;
  isolation:isolate;
  --inset:calc(var(--gap)/2 + var(--thumb-width)/2);
  transition:--inset var(--anim);
  --m3-primary:var(--md-sys-color-primary);
  --m3-inactive:var(--md-sys-color-secondary-container);
  --m3-dot:var(--md-sys-color-on-surface-variant);
  --percent:14;
  --slider-width:320px;
  --thumb-width:4px;
  --gap:12px;
  --thumb-width-pressed:2px;
  --gap-pressed:8px;
  --track-height:16px;
  --outer-radius:calc(var(--track-height)/2);
  --inner-radius:4px;
  --anim:150ms cubic-bezier(0.2,0,0,1);
}

.m3-slider-container:active,
.m3-slider-container.pressed{
  --thumb-width:var(--thumb-width-pressed);
  --gap:var(--gap-pressed);
}

.m3-slider-input{
  position:absolute;
  width:100%;
  height:100%;
  margin:0;
  opacity:0;
  cursor:pointer;
  z-index:10;
  -webkit-appearance:none;
  outline:none;
}

.m3-track-wrapper{
  position:absolute;
  left:0;
  right:0;
  height:var(--track-height);
  top:50%;
  transform:translateY(-50%);
  pointer-events:none;
}

.m3-track-active-outer{
  position:absolute;
  left:0;
  top:0;
  height:100%;
  width:calc(var(--percent)*1%);
}

.m3-track-inactive-outer{
  position:absolute;
  right:0;
  top:0;
  height:100%;
  width:calc(100% - (var(--percent)*1%));
}

.m3-track-active{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  right:var(--inset);
  background:var(--m3-primary);
  --w:max(0px,calc((var(--percent)*var(--slider-width))/100 - var(--inset)));
  --cap:min(var(--outer-radius),var(--w)/2);
  --cap-in:min(var(--inner-radius),var(--w)/2);

  get time(){ try{return JSON.parse(localStorage.getItem('rwd_time'))}catch{return null} },
  set time(v){ localStorage.setItem('rwd_time', JSON.stringify(v)) },
  get accent(){ return localStorage.getItem('rwd_accent') },
  set accent(v){ localStorage.setItem('rwd_accent', v) }
};

const PATTERNS = [
  /\b(died|death|passed\s+away|obit)\b/i,
  /(умер|скончался|погиб|умерла|скончалась|дата\s+смерти|похоронен)/i,
  /category:.*deaths/i,
  /категория:.*умершие/i,
  /\b(18\d{2}|19\d{2}|20[0-2]\d)\s*[–-—]\s*(20\d{2})\b/
];

const Y = new Date().getFullYear();

const CB_SVGS =
  `<svg class="g g-check" viewBox="0 0 18 18" aria-hidden="true"><path d="M4.2 9.4 7.4 12.6 13.8 5.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>` +
  `<svg class="g g-ind" viewBox="0 0 18 18" aria-hidden="true"><rect x="4" y="8" width="10" height="2" rx="1" fill="currentColor"/></svg>`;

function cap(s){
  return s[0].toUpperCase()+s.slice(1);
}

function nameIn(code,loc){
  try{
    const n = new Intl.DisplayNames([loc],{type:'language'}).of(code);
    if(!n || n.toLowerCase()===code.toLowerCase()) return null;
    return cap(n);
  }catch{
    return null;
  }
}

function displayName(code){
  return nameIn(code,uiLang) || nameIn(code,'en') || code.toUpperCase();
}

function mkTarget(lang,category){
  return {
    lang,
    category,
    name: displayName(lang),
    enName: nameIn(lang,'en') || lang.toUpperCase(),
    natName: nameIn(lang,lang) || nameIn(lang,'en') || lang.toUpperCase()
  };
}

const FALLBACK = [
  ['en',`Category:${Y} deaths`],
  ['ru',`Категория:Умершие в ${Y} году`],
  ['de',`Kategorie:Gestorben ${Y}`],
  ['fr',`Catégorie:Décès en ${Y}`],
  ['es',`Categoría:Fallecidos en ${Y}`],
  ['it',`Categoria:Morti nel ${Y}`],
  ['ja',`Category:${Y}年没`],
  ['zh',`Category:${Y}年逝世`],
  ['pt',`Categoria:Mortos em ${Y}`],
  ['nl',`Categorie:Overleden in ${Y}`],
  ['pl',`Kategoria:Zmarli w ${Y}`],
  ['uk',`Категорія:Померли ${Y}`],
  ['ar',`تصنيف:وفيات ${Y}`],
  ['fi',`Luokka:Vuonna ${Y} kuolleet`],
  ['sv',`Kategori:Avlidna ${Y}`],
  ['sk',`Kategória:Úmrtia v ${Y}`],
  ['cs',`Kategorie:Úmrtí v ${Y}`]
].map(([lang,category])=>mkTarget(lang,category));

const dedupe = list => list.filter((t,i,a)=>a.findIndex(x=>x.lang===t.lang)===i);

async function fetchTargets(){
  const year = new Date().getFullYear();
  const map = new Map();
  let cont = null;

  do{
    try{
      const p = new URLSearchParams({action:'query',titles:`Category:${year} deaths`,prop:'langlinks',lllimit:'500',format:'json',origin:'*'});
      if(cont) p.set('llcontinue',cont);
      const j = await (await fetch('https://en.wikipedia.org/w/api.php?'+p)).json();
      const page = Object.values(j.query?.pages||{})[0];
      (page?.langlinks||[]).forEach(l=>map.set(l.lang,l['*']));
      cont = j.continue?.llcontinue || null;
    }catch{
      break;
    }
  }while(cont);

  if(map.size===0) return FALLBACK;
  if(!map.has('en')) map.set('en',`Category:${year} deaths`);

  const list = [...map.entries()].map(([lang,category])=>mkTarget(lang,category));
  const prio = [...new Set(['en',...navigator.languages.map(l=>l.split('-')[0].toLowerCase())])];
  const head = prio.map(c=>list.find(t=>t.lang===c)).filter(Boolean);
  const rest = list.filter(t=>!head.includes(t)).sort((a,b)=>{
    const x=a.name.toLowerCase(), y=b.name.toLowerCase();
    return x<y?-1:x>y?1:0;
  });

  return dedupe([...head,...rest]);
}

async function fetchMembers(t){
  const p = new URLSearchParams({action:'query',list:'categorymembers',cmtitle:t.category,cmprop:'title|timestamp',cmsort:'timestamp',cmdir:'desc',cmlimit:'15',format:'json',origin:'*'});
  const r = await fetch(`https://${t.lang}.wikipedia.org/w/api.php?${p}`);
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j = await r.json();
  return (j.query?.categorymembers||[]).filter(m=>m.ns===0).map(m=>({
    id:Math.random().toString(36).slice(2),
    title:m.title,
    wiki:t.lang,
    ts:Date.now()
  }));
}

async function enrich(list){
  const by = {};
  list.forEach(e=>(by[e.wiki] ||= []).push(e));

  for(const [wiki,arr] of Object.entries(by))
    for(let i=0;i<arr.length;i+=5){
      const batch = arr.slice(i,i+5);
      try{
        const p = new URLSearchParams({action:'query',prop:'extracts|pageprops',ppprop:'description',exintro:'1',explaintext:'1',exchars:'300',redirects:'1',titles:batch.map(e=>e.title).join('|'),format:'json',origin:'*'});
        const j = await (await fetch(`https://${wiki}.wikipedia.org/w/api.php?${p}`)).json();
        const map = {};
        Object.values(j.query?.pages||{}).forEach(pg=>{ if(pg.title) map[pg.title]=pg; });
        batch.forEach(e=>{
          const pg=map[e.title];
          if(pg){
            e.desc=pg.pageprops?.description;
            e.extract=(pg.extract||'').split('\n')[0];
          }
        });
      }catch{}
    }

  return list;
}

async function loadHistory(langs){
  await Promise.all(langs.map(async lang=>{
    if(state.fetched.has(lang)) return;
    state.fetched.add(lang);
    const t = state.targets.find(t=>t.lang===lang);
    if(!t) return;
    try{
      const items = await fetchMembers(t);
      state.success++;
      state.history.push(...items);
      renderFeed();
      enrich(items).then(renderFeed);
    }catch(e){
      state.failed.push({lang,msg:String(e?.message||e)});
    }
  }));
  state.loading = false;
  renderFeed();
}

function openStream(){
  const es = new EventSource('https://stream.wikimedia.org/v2/stream/recentchange');
  es.addEventListener('message', ev=>{
    try{
      const d = JSON.parse(ev.data);
      if(d.namespace!==0 || d.project!=='wikipedia') return;
      const title=d.title||'', comment=d.comment||'';
      if(!PATTERNS.some(r=>r.test(title)||r.test(comment))) return;
      const e = {
        id:Math.random().toString(36).slice(2),
        wiki:(d.server_name||'').split('.')[0],
        title,
        ts:(d.timestamp||Date.now()/1000)*1000,
        comment
      };
      state.live.push(e);
      if(state.live.length>300) state.live.shift();
      renderFeed();
      enrich([e]).then(renderFeed);
    }catch{}
  });
}

const visible = () => {
  const now = Date.now();
  const src = state.mode==='live' ? state.live : state.live.concat(state.history);
  return src.filter(e=>state.selected.has(e.wiki) &&
    (state.mode==='live' || now-e.ts<=state.hours*36e5)).sort((a,b)=>b.ts-a.ts);
};

const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderFeed(){
  const list = visible();
  let html = '';

  if(state.loading) html += '<div class="progress"></div>';

  if(!state.loading){
    if(state.success===0) html += `<div class="status">${esc(UI.errT)}<button data-dlg="1">${UI.details}</button></div>`;
    else if(state.failed.length) html += `<div class="status">${esc(UI.errP)}<br>${esc(UI.errS(state.success,state.targets.length))}<button data-dlg="1">${UI.details}</button></div>`;
  }

  if(list.length){
    html += '<div class="group">' + list.map(e=>`
      <a class="card click" href="https://${e.wiki}.wikipedia.org/wiki/${encodeURIComponent(e.title)}">
        <div class="txt">
          <div class="ev-head"><span class="badge">${e.wiki.toUpperCase()}</span>
            <span class="ev-time">${new Date(e.ts).toLocaleString(uiLang,{dateStyle:'medium',timeStyle:'short'})}</span></div>
          <p class="ev-title">${esc(e.title)}</p>
          ${e.desc||e.extract?`<p class="ev-desc">${esc(e.desc||e.extract)}</p>`:''}
          ${e.comment?`<p class="ev-comment">${esc(e.comment)}</p>`:''}
        </div>
      </a>`).join('') + '</div>';
  } else if(!state.loading && state.success>0 && !state.failed.length){
    html += `<p class="muted">${UI.empty}</p>`;
  }

  $('#feedList').innerHTML = html;
}

function langCard(t){
  return `
  <div class="card click ${state.selected.has(t.lang)?'checked':''}" data-lang="${t.lang}">
    <span class="cb">${CB_SVGS}</span>
    <div class="txt"><p class="t">${esc(t.name)}</p><p class="s code">${t.lang.toUpperCase()}</p></div>
  </div>`;
}

function renderLangs(){
  const all = state.targets.length>0 && state.selected.size===state.targets.length;
  const some = state.selected.size>0 && !all;

  let html = `<div class="group">
    <div class="card click ${all?'checked':some?'ind':''}" data-all="1">
      <span class="cb">${CB_SVGS}</span>
      <div class="txt"><p class="t">${UI.all}</p><p class="s">${UI.sel(state.selected.size,state.targets.length)}</p></div>
    </div>`;

  html += state.targets.map(langCard).join('') + '</div>';
  $('#langWrap').innerHTML = html;
}

function renderAccents(){
  $('#accentRow').innerHTML = ACCENTS.map(a=>`
    <button class="accent ${state.accent===a?'on':''}" data-accent="${a}" aria-label="${a}">
      <svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
    </button>`).join('');
}

const matches = (t,q) =>
  t.name.toLowerCase().includes(q) ||
  t.enName.toLowerCase().includes(q) ||
  t.natName.toLowerCase().includes(q) ||
  t.lang.includes(q);

function renderSearch(){
  const q = state.query.trim().toLowerCase();
  const list = q ? state.targets.filter(t=>matches(t,q)) : state.targets;
  $('#searchWrap').innerHTML = '<div class="group">' + list.map(langCard).join('') + '</div>';
}

$('#settingsTitle').textContent = UI.settings;
$('#settingsTitleSmall').textContent = UI.settings;
$('#secTime').textContent = UI.timeframe;
$('#secAccent').textContent = UI.accent;
$('#secLangs').textContent = UI.sections;
$('#lblLive').textContent = UI.live;
$('#lblLast').textContent = UI.last;
$('#dlgTitle').textContent = UI.dlg;
$('#dlgDone').textContent = UI.done;

const sliderEl = $('#hoursSlider');

new ResizeObserver(()=>sliderEl.style.setProperty('--slider-width', sliderEl.clientWidth+'px')).observe(sliderEl);

sliderEl.addEventListener('pointerdown', ()=>sliderEl.classList.add('pressed'));
addEventListener('pointerup',    ()=>sliderEl.classList.remove('pressed'));
addEventListener('pointercancel',()=>sliderEl.classList.remove('pressed'));
addEventListener('blur',         ()=>sliderEl.classList.remove('pressed'));

function syncSlider(){
  const r = $('#hoursRange');
  r.value = state.hours;
  const min = +r.min || 1, max = +r.max || 168;
  const pct = (state.hours - min) / (max - min) * 100;
  sliderEl.style.setProperty('--percent', pct);
  $('#hoursLabel').textContent = UI.h(state.hours);
}

$('#hoursRange').addEventListener('input', e=>{
  state.hours = +e.target.value;
  store.time = {live:state.mode==='live', hours:state.hours};
  syncSlider();
  renderFeed();
});

function syncTimeUI(){
  $('#modeLive').classList.toggle('on', state.mode==='live');
  $('#modeLast').classList.toggle('on', state.mode==='last');
  syncSlider();
}

let sliderAnim = null;

function setSliderVisible(showIt){
  const el = $('#sliderBox');
  sliderAnim?.cancel();

  if(showIt){
    el.hidden = false;
    syncSlider();
    sliderAnim = el.animate(
      [{height:'0px',opacity:0},{height:el.scrollHeight+'px',opacity:1}],
      {duration:220,easing:'cubic-bezier(0,0,.2,1)'});
    sliderAnim.onfinish = ()=>{ el.style.height=''; };
  } else {
    sliderAnim = el.animate(
      [{height:el.scrollHeight+'px',opacity:1},{height:'0px',opacity:0}],
      {duration:180,easing:'cubic-bezier(.4,0,1,1)'});
    sliderAnim.onfinish = ()=>{ el.hidden = true; };
  }
}

$('#modeLive').onclick = ()=>{
  if(state.mode!=='live'){
    state.mode='live';
    store.time={live:true,hours:state.hours};
    syncTimeUI();
    setSliderVisible(false);
    renderFeed();
  }
};

$('#modeLast').onclick = ()=>{
  if(state.mode!=='last'){
    state.mode='last';
    store.time={live:false,hours:state.hours};
    syncTimeUI();
    setSliderVisible(true);
    renderFeed();
  }
};

$('#accentRow').addEventListener('click', e=>{
  const b = e.target.closest('.accent');
  if(!b) return;
  state.accent = b.dataset.accent;
  store.accent = state.accent;
  document.documentElement.dataset.accent = state.accent;
  renderAccents();
});

const ORDER = ['feedScreen','settingsScreen','searchScreen'];
let navClean = null;

function show(id){
  if(navClean){
    navClean();
    navClean = null;
  }

  const fromId = ORDER.find(s=>!$('#'+s).hidden);
  scrollTo(0,0);
  updateBars();
  if(fromId === id) return;

  const from = $('#'+fromId);
  const to = $('#'+id);
  const fwd = ORDER.indexOf(id) > ORDER.indexOf(fromId);

  from.style.position = 'absolute';
  from.style.top = '0';
  from.style.left = '0';
  from.style.width = '100%';
  from.style.zIndex = '4';
  from.style.pointerEvents = 'none';

  to.hidden = false;

  const out = from.animate(
    [{opacity:1, transform:'translateX(0)'},
     {opacity:0, transform:`translateX(${fwd?-32:32}px)`}],
    {duration:180, easing:'cubic-bezier(.4,0,1,1)'});

  to.animate(
    [{opacity:0, transform:`translateX(${fwd?32:-32}px)`},
     {opacity:1, transform:'translateX(0)'}],
    {duration:240, easing:'cubic-bezier(0,0,.2,1)'});

  navClean = ()=>{
    from.hidden = true;
    from.style.cssText = '';
  };

  out.onfinish = ()=>{
    navClean = null;
    from.hidden = true;
    from.style.cssText = '';
  };
}

$('#openSettings').onclick = ()=>show('settingsScreen');
$('#backBtn').onclick = ()=>show('feedScreen');

$('#openSearch').onclick = ()=>{
  show('searchScreen');
  setTimeout(()=>$('#q').focus(),60);
};

$('#searchBack').onclick = ()=>{
  state.query='';
  $('#q').value='';
  $('#qClear').hidden=true;
  $('#q').blur();
  renderSearch();
  show('settingsScreen');
};

$('#q').oninput = e=>{
  state.query=e.target.value;
  $('#qClear').hidden=!state.query;
  renderSearch();
};

$('#qClear').onclick = ()=>{
  state.query='';
  $('#q').value='';
  $('#qClear').hidden=true;
  renderSearch();
  $('#q').focus();
};

function onLangClick(e){
  const card = e.target.closest('.card');
  if(!card) return;

  if(card.dataset.all){
    const on = state.selected.size!==state.targets.length;
    state.selected = new Set(on ? state.targets.map(t=>t.lang) : []);
  } else {
    const l = card.dataset.lang;
    state.selected.has(l) ? state.selected.delete(l) : state.selected.add(l);
  }

  store.sel = state.selected;
  renderLangs();
  renderSearch();
  renderFeed();

  const fresh = [...state.selected].filter(l=>!state.fetched.has(l));
  if(fresh.length) loadHistory(fresh);
}

$('#langWrap').addEventListener('click', onLangClick);
$('#searchWrap').addEventListener('click', onLangClick);

$('#feedList').addEventListener('click', e=>{
  if(e.target.closest('[data-dlg]')){
    $('#dlgBody').innerHTML = '<div class="items">' + state.failed.map(f=>`
      <div class="item">
        <div class="t">${f.lang.toUpperCase()}</div>
        <div class="s">${esc(f.msg)}</div>
      </div>`).join('') + '</div>';
    $('#errDialog').showModal();
    return;
  }
});

$('#dlgDone').onclick = ()=>$('#errDialog').close();

function updateBars(){
  const c = scrollY > 40;
  $('#feedBar').classList.toggle('collapsed', c && !$('#feedScreen').hidden);
  $('#settingsBar').classList.toggle('collapsed', c && !$('#settingsScreen').hidden);
}

addEventListener('scroll', updateBars, {passive:true});

(function(){
  const t = store.time;
  if(t){
    state.mode = t.live?'live':'last';
    state.hours = t.hours||24;
  }
  $('#sliderBox').hidden = state.mode!=='last';
  syncTimeUI();

  state.accent = store.accent || 'orange';
  document.documentElement.dataset.accent = state.accent;
  renderAccents();

  state.targets = FALLBACK;
  const saved = store.sel;
  state.selected = new Set(saved
    ? saved.filter(l=>state.targets.some(t=>t.lang===l))
    : (()=>{
        const s=[...new Set(navigator.languages.map(l=>l.split('-')[0].toLowerCase()))].filter(c=>state.targets.some(t=>t.lang===c));
        return s.length?s:['en'];
      })());
  store.sel = state.selected;

  renderLangs();
  renderSearch();
  renderFeed();
  loadHistory([...state.selected]);
  fetchTargets().then(list=>{
    state.targets = dedupe(list);
    renderLangs();
    renderSearch();
  });

  openStream();
  setInterval(renderFeed, 60000);
})();
</script>
</body>
</html>
